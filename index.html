<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080b12">
  <title>舞台キュー｜文化祭 音響・背景コントローラー</title>
  <style>
    :root{color-scheme:dark;--bg:#080b12;--panel:#111724;--line:#263043;--muted:#8d9ab0;--cyan:#25d4ed;--violet:#a78bfa;--rose:#fb526e;--radius:18px;font-family:"Yu Gothic UI","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 18% -10%,#143044 0,transparent 34%),var(--bg);color:#f8fafc}button,input{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    header{position:sticky;top:0;z-index:20;border-bottom:1px solid #ffffff17;background:#0b101bdc;backdrop-filter:blur(16px)}
    .topbar{max-width:1500px;margin:auto;padding:15px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px}.logo{display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--cyan);color:#061118;box-shadow:0 0 28px #25d4ed45}.brand h1{margin:0;font-size:19px}.brand p{margin:2px 0 0;color:var(--muted);font-size:12px}.header-actions{display:flex;align-items:center;gap:14px}.ready{font-size:14px;color:#65e6b2}.ready::before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:#4adea0;box-shadow:0 0 10px #4adea0}
    .btn{min-height:42px;padding:0 16px;border:1px solid #ffffff1d;border-radius:11px;background:#ffffff0a;color:white;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:.18s}.btn:hover{background:#ffffff13;border-color:#ffffff32}.btn.primary{background:#7c55e7;border-color:#9a7cf0}.btn.primary:hover{background:#8d6dec}.btn.stop{background:#ef3f5b;border-color:#fb7087}.btn.stop:hover{background:#fa506b}.btn.small{min-height:34px;padding:0 11px;font-size:13px}.icon{width:18px;height:18px;display:block}
    .layout{max-width:1500px;margin:auto;padding:28px;display:grid;grid-template-columns:minmax(0,1fr) 390px;gap:26px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:15px;margin-bottom:15px}.eyebrow{margin:0;color:var(--cyan);font:700 12px/1.2 ui-monospace,monospace;letter-spacing:.19em}.side .eyebrow{color:#c3afff}.section-head h2,.side h2{font-size:25px;margin:5px 0 0}.add-input{position:absolute;inline-size:1px;block-size:1px;opacity:0;pointer-events:none}
    .pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}.pad{--pad:#25d4ed;position:relative;min-height:154px;overflow:hidden;padding:19px;border:1px solid #ffffff1e;border-radius:var(--radius);background:linear-gradient(145deg,#ffffff16,#ffffff07);color:#fff;text-align:left;box-shadow:inset 0 1px #ffffff0a;transition:.16s}.pad::after{content:"";position:absolute;inset:auto 0 0;height:4px;background:var(--pad)}.pad:hover{transform:translateY(-2px);border-color:var(--pad);box-shadow:0 12px 36px color-mix(in srgb,var(--pad) 18%,transparent)}.pad:active{transform:scale(.975)}.pad.playing{border-color:var(--pad);box-shadow:0 0 0 2px color-mix(in srgb,var(--pad) 30%,transparent),0 14px 42px color-mix(in srgb,var(--pad) 20%,transparent)}.pad .key{position:absolute;right:13px;top:13px;padding:4px 8px;border:1px solid #ffffff1b;border-radius:7px;background:#0003;color:#ffffff88;font:12px ui-monospace,monospace}.pad-icon{display:grid;place-items:center;width:44px;height:44px;margin-bottom:23px;border-radius:50%;background:#ffffff12;color:var(--pad)}.pad strong{display:block;font-size:18px}.pad small{display:block;margin-top:5px;color:#ffffff79}.pad .remove{position:absolute;right:10px;bottom:10px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:#ffffff4e;font-size:17px;opacity:0;transition:.15s}.pad:hover .remove,.pad:focus-within .remove{opacity:1}.pad .remove:hover{background:#fb526e25;color:#ff8799}.empty{grid-column:1/-1;min-height:260px;display:grid;place-items:center;text-align:center;border:1px dashed #ffffff2b;border-radius:var(--radius);background:#ffffff05;color:var(--muted)}.empty strong{display:block;margin-bottom:7px;color:#dbe4f1;font-size:18px}
    .master{margin-top:16px;padding:16px 18px;display:grid;grid-template-columns:auto 105px minmax(120px,420px);align-items:center;gap:14px;border:1px solid #ffffff17;border-radius:var(--radius);background:#ffffff09}.master svg{color:var(--cyan)}.master label{font-size:14px;font-weight:700}.master input{width:100%;accent-color:var(--cyan)}
    .side>h2{margin-bottom:15px}.projector-card,.status{overflow:hidden;border:1px solid #ffffff19;border-radius:var(--radius);background:var(--panel)}.preview{position:relative;aspect-ratio:16/9;display:grid;place-items:center;background:radial-gradient(circle at 30% 25%,#17536b,transparent 38%),linear-gradient(135deg,#101d32,#190e2a);background-position:center;background-size:cover;text-align:center}.preview::after{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff08 1px,transparent 1px),linear-gradient(90deg,#ffffff08 1px,transparent 1px);background-size:22px 22px;pointer-events:none}.preview.has-image::after{display:none}.preview-empty{position:relative;z-index:1;color:#ffffff91}.preview-empty svg{margin:auto}.preview-empty b{display:block;margin-top:8px;font-size:14px}.preview-empty small{display:block;margin-top:5px}.projector-actions{padding:14px;display:grid;grid-template-columns:1fr 1fr;gap:10px}.backgrounds{display:flex;gap:9px;padding:0 14px 14px;overflow:auto}.thumb{position:relative;flex:0 0 86px;height:52px;padding:0;border:2px solid transparent;border-radius:9px;background:#05070c center/cover;color:white;overflow:hidden}.thumb.selected{border-color:var(--violet);box-shadow:0 0 16px #a78bfa55}.thumb.black{border-color:#ffffff20;font-size:11px}.thumb .x{position:absolute;right:2px;top:2px;border:0;border-radius:5px;background:#000a;color:white;line-height:18px;width:20px;height:20px;display:none}.thumb:hover .x{display:block}.status{margin-top:18px;padding:18px}.status-row{display:flex;justify-content:space-between;font-size:14px;font-weight:700}.status-state{font-size:12px;color:#667085}.status-state.on{color:var(--cyan)}.now{margin:13px 0 0;font-size:18px;font-weight:800}.meter{display:flex;align-items:end;gap:4px;height:26px;margin-top:15px}.meter i{display:block;width:100%;height:5px;border-radius:3px;background:#ffffff14;transition:.15s}.meter.on i{background:var(--cyan);animation:bounce .5s ease-in-out infinite alternate}.meter.on i:nth-child(3n){animation-delay:.12s}.meter.on i:nth-child(2n){animation-delay:.25s}@keyframes bounce{to{height:var(--h)}}
    .note{margin-top:14px;padding:13px 15px;border-left:3px solid #fbbf24;border-radius:4px 10px 10px 4px;background:#fbbf2410;color:#d5d9e2;font-size:13px;line-height:1.7}.note b{color:#ffe399}
    dialog{width:min(440px,calc(100% - 30px));border:1px solid #ffffff20;border-radius:18px;background:#131a28;color:white;box-shadow:0 30px 90px #000b;padding:0}dialog::backdrop{background:#03050ac4;backdrop-filter:blur(4px)}.dialog-body{padding:23px}.dialog-body h3{margin:0 0 18px;font-size:21px}.field{display:grid;gap:7px;margin:14px 0}.field label{font-size:13px;font-weight:700;color:#cbd5e1}.field input{width:100%;height:43px;padding:0 12px;border:1px solid #ffffff24;border-radius:10px;background:#080c14;color:white}.colors{display:flex;gap:9px}.color{width:35px;height:35px;border:2px solid transparent;border-radius:50%;background:var(--c)}.color.active{border-color:white;box-shadow:0 0 0 3px #ffffff1e}.dialog-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:22px}
    .toast{position:fixed;z-index:50;left:50%;bottom:25px;transform:translate(-50%,120px);padding:12px 17px;border:1px solid #ffffff1c;border-radius:11px;background:#182131;color:white;box-shadow:0 12px 36px #0008;transition:.25s}.toast.show{transform:translate(-50%,0)}
    .projector-mode{margin:0;background:#000;overflow:hidden}.projector-stage{width:100vw;height:100vh;background:#000 center/cover no-repeat}.projector-hint{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);padding:8px 13px;border-radius:8px;background:#0009;color:#ffffff99;font-size:13px;opacity:1;transition:opacity 1s}.projector-hint.fade{opacity:0}
    @media(max-width:1000px){.layout{grid-template-columns:1fr}.side{display:grid;grid-template-columns:1fr 1fr;gap:16px}.side>.eyebrow,.side>h2{grid-column:1/-1}.status{margin-top:0}.note{grid-column:1/-1}}
    @media(max-width:650px){.topbar{padding:12px 16px}.brand p,.ready{display:none}.layout{padding:18px 14px}.pads{grid-template-columns:repeat(2,1fr)}.pad{min-height:138px}.side{display:block}.status{margin-top:15px}.master{grid-template-columns:auto 1fr}.master input{grid-column:1/-1}.projector-actions{grid-template-columns:1fr}.section-head .btn span{display:none}}
    @media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
  </style>
</head>
<body>
  <div id="app">
    <header>
      <div class="topbar">
        <div class="brand"><div class="logo" aria-hidden="true"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 10v4M6 6v12M10 3v18M14 7v10M18 5v14M22 10v4"/></svg></div><div><h1>舞台キュー</h1><p>文化祭公演・音響／映像コントローラー</p></div></div>
        <div class="header-actions"><span class="ready">準備完了</span><button class="btn stop" id="stopAll"><svg class="icon" viewBox="0 0 24 24" fill="currentColor"><rect x="5" y="5" width="14" height="14" rx="1"/></svg>全停止</button></div>
      </div>
    </header>
    <main class="layout">
      <section>
        <div class="section-head"><div><p class="eyebrow">SOUND CUES</p><h2>効果音パッド</h2></div><label class="btn" for="audioInput"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg><span>効果音を追加</span></label><input class="add-input" id="audioInput" type="file" accept="audio/*" multiple></div>
        <div class="pads" id="pads"></div>
        <div class="master"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg><label for="volume">音量 <span id="volumeValue">84</span></label><input id="volume" type="range" min="0" max="100" value="84"></div>
      </section>
      <aside class="side"><p class="eyebrow">PROJECTOR</p><h2>背景</h2>
        <div class="projector-card"><div class="preview" id="preview"><div class="preview-empty" id="previewEmpty"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-5-5L5 21"/></svg><b>背景未選択</b><small>画像を追加して投影できます</small></div></div><div class="projector-actions"><label class="btn" for="imageInput">画像を追加</label><input class="add-input" id="imageInput" type="file" accept="image/*" multiple><button class="btn primary" id="openProjector">投影画面を開く</button></div><div class="backgrounds" id="backgrounds"></div></div>
        <div class="status"><div class="status-row"><span>再生状況</span><span class="status-state" id="statusState">待機中</span></div><p class="now" id="nowPlaying">—</p><div class="meter" id="meter" aria-hidden="true"></div></div>
        <div class="note"><b>本番前チェック</b><br>プロジェクターを「画面拡張」にして投影画面を移動し、全画面表示にしてください。番号キーでも効果音を再生できます。</div>
      </aside>
    </main>
  </div>

  <dialog id="soundDialog"><form method="dialog" class="dialog-body" id="soundForm"><h3>効果音を登録</h3><div class="field"><label for="soundName">ボタン名</label><input id="soundName" required maxlength="30" autocomplete="off"></div><div class="field"><label>ボタンの色</label><div class="colors" id="colors"></div></div><div class="dialog-actions"><button class="btn" value="cancel">キャンセル</button><button class="btn primary" id="saveSound" value="default">登録する</button></div></form></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script>
  (()=>{
    const q=new URLSearchParams(location.search);
    if(q.has('projector')){initProjector();return}
    const $=s=>document.querySelector(s), padsEl=$('#pads'), backgroundsEl=$('#backgrounds'), preview=$('#preview'), empty=$('#previewEmpty');
    const colors=['#25d4ed','#fbbf24','#a78bfa','#fb7185','#a3e635','#60a5fa','#f472b6','#fb923c'];
    let sounds=[],backgrounds=[],pendingFiles=[],selectedBg=null,projector=null,db,toastTimer;
    const active=new Map();
    $('#meter').innerHTML=Array.from({length:15},(_,i)=>`<i style="--h:${8+(i*7)%20}px"></i>`).join('');
    $('#colors').innerHTML=colors.map((c,i)=>`<button type="button" class="color ${i===0?'active':''}" data-color="${c}" style="--c:${c}" aria-label="色 ${i+1}"></button>`).join('');
    let chosenColor=colors[0];
    $('#colors').onclick=e=>{const b=e.target.closest('.color');if(!b)return;chosenColor=b.dataset.color;document.querySelectorAll('.color').forEach(x=>x.classList.toggle('active',x===b))};

    openDb().then(async d=>{db=d;sounds=await all('sounds');backgrounds=await all('backgrounds');renderPads();renderBackgrounds()}).catch(()=>showToast('保存機能を開けませんでした'));
    function openDb(){return new Promise((res,rej)=>{const r=indexedDB.open('stage-cue-db',1);r.onupgradeneeded=()=>{r.result.createObjectStore('sounds',{keyPath:'id'});r.result.createObjectStore('backgrounds',{keyPath:'id'})};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    function all(store){return new Promise((res,rej)=>{const r=db.transaction(store).objectStore(store).getAll();r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
    function put(store,item){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).put(item);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
    function del(store,id){return new Promise((res,rej)=>{const r=db.transaction(store,'readwrite').objectStore(store).delete(id);r.onsuccess=res;r.onerror=()=>rej(r.error)})}
    function esc(s){const d=document.createElement('div');d.textContent=s;return d.innerHTML}
    function renderPads(){
      if(!sounds.length){padsEl.innerHTML='<div class="empty"><div><strong>効果音を登録してください</strong>「効果音を追加」から音声ファイルを選びます<br><small>MP3・WAV・M4Aなどに対応</small></div></div>';return}
      padsEl.innerHTML=sounds.map((s,i)=>`<button class="pad" data-id="${s.id}" style="--pad:${s.color}"><span class="key">${i<9?i+1:'—'}</span><span class="pad-icon"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 5 6 9H2v6h4l5 4zM15 9a5 5 0 0 1 0 6M18 6a9 9 0 0 1 0 12"/></svg></span><strong>${esc(s.name)}</strong><small>クリックで再生</small><span class="remove" role="button" title="削除" aria-label="${esc(s.name)}を削除">×</span></button>`).join('')
    }
    padsEl.onclick=e=>{const pad=e.target.closest('.pad');if(!pad)return;if(e.target.closest('.remove')){removeSound(pad.dataset.id);return}playSound(pad.dataset.id)};
    function playSound(id){const s=sounds.find(x=>x.id===id);if(!s)return;const audio=new Audio(URL.createObjectURL(s.file));audio.volume=$('#volume').value/100;audio.onended=()=>finishAudio(id,audio);audio.onerror=()=>{finishAudio(id,audio);showToast('音声を再生できませんでした')};active.set(id,audio);audio.play();setNow(s.name,true);document.querySelector(`.pad[data-id="${id}"]`)?.classList.add('playing')}
    function finishAudio(id,audio){URL.revokeObjectURL(audio.src);if(active.get(id)===audio)active.delete(id);document.querySelector(`.pad[data-id="${id}"]`)?.classList.remove('playing');if(!active.size)setNow('—',false)}
    function stopAll(){active.forEach(a=>{a.pause();URL.revokeObjectURL(a.src)});active.clear();document.querySelectorAll('.pad').forEach(x=>x.classList.remove('playing'));setNow('—',false);showToast('すべての音を停止しました')}
    function setNow(name,on){$('#nowPlaying').textContent=name;$('#statusState').textContent=on?'再生中':'待機中';$('#statusState').classList.toggle('on',on);$('#meter').classList.toggle('on',on)}
    async function removeSound(id){const s=sounds.find(x=>x.id===id);if(!s||!confirm(`「${s.name}」を削除しますか？`))return;active.get(id)?.pause();await del('sounds',id);sounds=sounds.filter(x=>x.id!==id);renderPads();if(!active.size)setNow('—',false);showToast('効果音を削除しました')}
    $('#stopAll').onclick=stopAll;
    $('#volume').oninput=e=>{const v=e.target.value;$('#volumeValue').textContent=v;active.forEach(a=>a.volume=v/100);localStorage.setItem('stage-volume',v)};
    const savedVol=localStorage.getItem('stage-volume');if(savedVol){$('#volume').value=savedVol;$('#volumeValue').textContent=savedVol}
    $('#audioInput').onchange=e=>{pendingFiles=[...e.target.files];if(!pendingFiles.length)return;$('#soundName').value=pendingFiles[0].name.replace(/\.[^.]+$/,'');$('#soundDialog').showModal();e.target.value=''};
    $('#soundForm').onsubmit=async e=>{if(e.submitter?.value==='cancel')return;e.preventDefault();const base=$('#soundName').value.trim();if(!base)return;for(let i=0;i<pendingFiles.length;i++){const f=pendingFiles[i];await put('sounds',{id:uid(),name:i?f.name.replace(/\.[^.]+$/,''):base,color:colors[(colors.indexOf(chosenColor)+i)%colors.length],file:f})}sounds=await all('sounds');renderPads();$('#soundDialog').close();showToast(`${pendingFiles.length}件の効果音を登録しました`)};

    $('#imageInput').onchange=async e=>{for(const f of e.target.files)await put('backgrounds',{id:uid(),name:f.name,file:f});backgrounds=await all('backgrounds');renderBackgrounds();if(!selectedBg&&backgrounds[0])selectBackground(backgrounds[0].id);showToast(`${e.target.files.length}件の背景を登録しました`);e.target.value=''};
    function renderBackgrounds(){backgroundsEl.innerHTML='<button class="thumb black '+(selectedBg===null?'selected':'')+'" data-id="black">黒画面</button>'+backgrounds.map(b=>`<button class="thumb ${selectedBg===b.id?'selected':''}" data-id="${b.id}" aria-label="${esc(b.name)}"><span class="x" role="button" title="削除">×</span></button>`).join('');backgrounds.forEach(b=>{const t=backgroundsEl.querySelector(`[data-id="${b.id}"]`);const u=URL.createObjectURL(b.file);t.style.backgroundImage=`url("${u}")`;t.dataset.url=u})}
    backgroundsEl.onclick=e=>{const t=e.target.closest('.thumb');if(!t)return;if(e.target.closest('.x')){removeBackground(t.dataset.id);return}selectBackground(t.dataset.id==='black'?null:t.dataset.id)};
    async function selectBackground(id){selectedBg=id;document.querySelectorAll('.thumb').forEach(t=>t.classList.toggle('selected',(id===null&&t.dataset.id==='black')||t.dataset.id===id));if(id===null){preview.style.backgroundImage='';preview.classList.remove('has-image');empty.classList.remove('hidden');sendProjector(null);return}const b=backgrounds.find(x=>x.id===id);if(!b)return;const data=await fileToData(b.file);preview.style.backgroundImage=`url("${data}")`;preview.classList.add('has-image');empty.classList.add('hidden');sendProjector(data)}
    async function removeBackground(id){const b=backgrounds.find(x=>x.id===id);if(!b||!confirm(`「${b.name}」を削除しますか？`))return;await del('backgrounds',id);backgrounds=backgrounds.filter(x=>x.id!==id);if(selectedBg===id)selectBackground(null);renderBackgrounds();showToast('背景を削除しました')}
    function fileToData(file){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(file)})}
    $('#openProjector').onclick=async()=>{projector=window.open(location.href.split('?')[0]+'?projector=1','stage-projector','popup=yes');if(!projector){showToast('ポップアップを許可してください');return}setTimeout(()=>selectBackground(selectedBg),350);showToast('投影画面を開きました')};
    function sendProjector(image){if(projector&&!projector.closed)projector.postMessage({type:'background',image},'*')}
    addEventListener('message',e=>{if(e.data?.type==='projector-ready')selectBackground(selectedBg)});
    addEventListener('keydown',e=>{if(e.target.matches('input')||$('#soundDialog').open)return;if(e.key==='Escape'){stopAll();return}const n=Number(e.key);if(n>=1&&n<=9&&sounds[n-1]){e.preventDefault();playSound(sounds[n-1].id)}});
    function uid(){return crypto.randomUUID?.()||Date.now().toString(36)+Math.random().toString(36).slice(2)}
    function showToast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),2200)}
    function registerWebMcp(){
      const context=document.modelContext;if(!context?.registerTool)return;
      const register=tool=>{try{Promise.resolve(context.registerTool(tool)).catch(()=>{})}catch{}}
      register({name:'play_sound_cue',title:'効果音を再生',description:'登録済みの効果音を名前で再生します。',inputSchema:{type:'object',properties:{name:{type:'string'}},required:['name'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:({name})=>{const s=sounds.find(x=>x.name===name);if(!s)throw new Error('指定された効果音が見つかりません');playSound(s.id);return{playing:s.name}}});
      register({name:'stop_all_sounds',title:'すべての音を停止',description:'現在再生中の効果音をすべて停止します。',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:()=>{stopAll();return{status:'stopped'}}});
      register({name:'set_projector_background',title:'背景を切り替え',description:'登録済みの背景画像をファイル名で選び、投影画面へ送ります。nameを空にすると黒画面になります。',inputSchema:{type:'object',properties:{name:{type:'string'}},required:['name'],additionalProperties:false},annotations:{readOnlyHint:false,untrustedContentHint:false},execute:async({name})=>{if(!name){await selectBackground(null);return{background:'black'}}const b=backgrounds.find(x=>x.name===name);if(!b)throw new Error('指定された背景が見つかりません');await selectBackground(b.id);return{background:b.name}}});
    }
    registerWebMcp();
    addEventListener('beforeunload',()=>{active.forEach(a=>a.pause())});
  })();
  function initProjector(){
    document.body.className='projector-mode';document.body.innerHTML='<div class="projector-stage" id="stage"></div><div class="projector-hint" id="hint">F11キーで全画面表示</div>';
    const stage=document.getElementById('stage'),hint=document.getElementById('hint');
    addEventListener('message',e=>{if(e.data?.type!=='background')return;stage.style.backgroundImage=e.data.image?`url("${e.data.image}")`:'none';stage.style.backgroundColor='#000'});
    if(opener)opener.postMessage({type:'projector-ready'},'*');setTimeout(()=>hint.classList.add('fade'),3500);
    document.addEventListener('dblclick',()=>document.documentElement.requestFullscreen?.());
  }
  </script>
